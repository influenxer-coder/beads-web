<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Beads B-shaped sitar icon</title>
  <desc id="desc">A vertical red sitar whose silhouette forms the letter B.</desc>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3347"/>
      <stop offset="1" stop-color="#a90022"/>
    </linearGradient>
    <linearGradient id="redDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cc1232"/>
      <stop offset="1" stop-color="#760018"/>
    </linearGradient>
  </defs>

  <!-- The sitar's neck acts as the spine of the letter B. -->
  <path fill="url(#red)" d="M278 92c0-30 24-54 54-54h48c30 0 54 24 54 54v80h34c146 0 264 96 264 214 0 73-44 138-112 177 93 38 158 113 158 202 0 132-139 239-310 239H332c-30 0-54-24-54-54V92zm156 190v211h39c70 0 127-47 127-105s-57-106-127-106h-39zm0 321v271h48c91 0 164-61 164-136 0-74-73-135-164-135h-48z"/>

  <!-- Tuning pegs make the B read as a sitar. -->
  <g fill="url(#redDark)">
    <path d="M274 150h-75c-21 0-38-17-38-38s17-38 38-38h75z"/>
    <circle cx="176" cy="112" r="49"/>
    <path d="M438 150h75c21 0 38-17 38-38s-17-38-38-38h-75z"/>
    <circle cx="536" cy="112" r="49"/>
    <path d="M274 242h-58c-18 0-32-14-32-32s14-32 32-32h58z"/>
    <circle cx="196" cy="210" r="40"/>
    <path d="M438 242h58c18 0 32-14 32-32s-14-32-32-32h-58z"/>
    <circle cx="516" cy="210" r="40"/>
  </g>

  <!-- Frets and strings. -->
  <g fill="none" stroke="#ffd7d9" stroke-linecap="round">
    <path stroke-width="12" d="M326 92v842M354 92v842M382 92v842"/>
    <path stroke-width="9" opacity=".9" d="M294 300h124M294 356h124M294 412h124M294 468h124M294 524h124M294 580h124M294 636h124M294 692h124"/>
  </g>

  <!-- Bridge and subtle bead detail. -->
  <rect x="303" y="779" width="108" height="34" rx="17" fill="#ffd7d9"/>
  <circle cx="356" cy="918" r="29" fill="#ffd7d9"/>
</svg>
